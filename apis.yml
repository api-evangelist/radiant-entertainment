name: Radiant Entertainment
description: >-
  Radiant Entertainment was an independent video game studio co-founded by
  brothers Tom and Tony Cannon, who also created the Evolution Championship
  Series (EVO), the premier fighting-game tournament. The studio was backed by
  Andreessen Horowitz (a16z) and is known for the free-to-play fighting game
  Rising Thunder and the voxel city-building title Stonehearth. Radiant
  Entertainment was acquired by Riot Games in 2016 and its team was folded into
  Riot; the studio no longer operates as an independent entity and publishes no
  public API, developer portal, or documentation surface. This profile was
  surfaced as an a16z portfolio company and added to the API Evangelist network.
